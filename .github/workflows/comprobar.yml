name: Comprobar

on:
  push:
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis de js/, marcador/ y sw.js
        run: for f in $(find js marcador -name '*.js') sw.js scripts/*.mjs; do node --check "$f" || exit 1; done
      - name: Versiones (?v=) de css/ y js/ al día en index.html
        run: node scripts/versionar.mjs --check
      - name: Pruebas de la lógica del Plan de estudio
        run: node --test tests/plan/*.test.mjs
