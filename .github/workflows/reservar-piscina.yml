name: Reservar piscina

# Cada noche a las 23:35 de Madrid (GitHub suele arrancar con retraso, así que se adelanta):
# si para el día que se abre a las 00:00 hay algo apuntado en la rama «piscina», entra y lo reserva.
on:
  schedule:
    - cron: '35 21 * * *' # 23:35 en horario de verano
    - cron: '35 22 * * *' # 23:35 en horario de invierno
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Día a reservar ahora mismo (AAAA-MM-DD, p. ej. 2026-10-23)'
        required: true
      hora:
        description: 'Hora'
        type: choice
        options: ['08:00', '09:00', '13:00', '14:00', '15:00', '22:00']
      prueba:
        description: 'Solo prueba (llega a elegir calle pero NO reserva)'
        type: boolean
        default: true
      carrito:
        description: 'En vez de reservar, confirmar lo que se quedó en el carrito'
        type: boolean
        default: false
      explorar:
        description: 'Solo para depurar: recorrer «Mi cuenta» y describir las pantallas'
        type: choice
        options: ['no', 'mirar', 'mirar y confirmar carrito', 'probar anular (sin anular)']
        default: 'no'

concurrency:
  group: reservar-piscina
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: reserva-piscina
    env:
      RESERVAS_JSON: /tmp/reservas.json
      # Lista de la pantalla «Piscina» de la app (la clave publicable es pública, como en js/nucleo.js)
      SUPABASE_URL: https://tsjaaqkvncgxqtpmlugv.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_F9-gdlx34vn7FQ_1hSHwcQ__L5EGMOS
      PISCINA_CLAVE: ${{ secrets.PISCINA_CLAVE }}
      FECHA: ${{ inputs.fecha }}
      HORA: ${{ inputs.hora }}
      PRUEBA: ${{ inputs.prueba }}
      CARRITO: ${{ inputs.carrito }}
      EXPLORAR: ${{ inputs.explorar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leer la lista de reservas
        run: |
          if git fetch --depth=1 origin piscina 2>/dev/null; then
            git show FETCH_HEAD:reserva-piscina/reservas.json > "$RESERVAS_JSON"
          else
            echo '{"reservas":{}}' > "$RESERVAS_JSON"
          fi

      - name: ¿Hay algo que reservar?
        id: toca
        run: |
          if [ "$CARRITO" = "true" ] || [ "${EXPLORAR:-no}" != "no" ]; then
            echo "hay=1" >> "$GITHUB_OUTPUT"
          elif [ -n "$FECHA" ]; then
            node reservar.mjs --comprobar --fecha "$FECHA" --hora "$HORA"
          else
            node reservar.mjs --comprobar
          fi

      - name: Preparar el navegador
        if: steps.toca.outputs.hay == '1'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Reservar
        if: steps.toca.outputs.hay == '1'
        env:
          IMD_USUARIO: ${{ secrets.IMD_USUARIO }}
          IMD_CONTRASENA: ${{ secrets.IMD_CONTRASENA }}
        run: |
          if [ "$EXPLORAR" = "probar anular (sin anular)" ]; then
            node anular.mjs --fecha "$FECHA" --hora "$HORA" --prueba
          elif [ "$EXPLORAR" = "mirar" ]; then
            node explorar.mjs
          elif [ "$EXPLORAR" = "mirar y confirmar carrito" ]; then
            node explorar.mjs --confirmar-carrito
          elif [ "$CARRITO" = "true" ]; then
            node reservar.mjs --carrito
          elif [ -n "$FECHA" ]; then
            extra=""; [ "$PRUEBA" = "true" ] && extra="--prueba"
            node reservar.mjs --fecha "$FECHA" --hora "$HORA" $extra
          else
            node reservar.mjs
          fi
