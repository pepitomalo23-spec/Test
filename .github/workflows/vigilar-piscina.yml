name: Vigilar piscina

# «Cogerla si se libera» (pantalla Piscina de la app): mientras haya alguna hora pedida para un día
# ya abierto, mira unas 2 veces por segundo y, en cuanto se libera, la reserva (cambiando la que tuvieras
# ese día), con el navegador ya preparado. Está siempre en marcha (leyendo la app cada 3 s: «Reservar
# ahora» y «Anular» se hacen en segundos); solo las noches con reserva programada para por el robot de
# las 00:00 (de 23:50 a 00:15);
# cada vigilancia dura hasta 5 h 45 min y al acabar lanza la siguiente. El aviso de cada 5 minutos es
# solo por si se corta esa cadena.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Prueba sin tocar nada: «AAAA-MM-DD HH:MM [hora vieja]». De verdad: «cambiar AAAA-MM-DD HH:MM hora-vieja» o «ida-y-vuelta AAAA-MM-DD HH:MM hora-vieja»'
        required: false

concurrency:
  group: vigilar-piscina
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para lanzar el relevo al acabar (vigilar.mjs, relevo())

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: reserva-piscina
    env:
      SUPABASE_URL: https://tsjaaqkvncgxqtpmlugv.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_F9-gdlx34vn7FQ_1hSHwcQ__L5EGMOS
      PISCINA_CLAVE: ${{ secrets.PISCINA_CLAVE }}
      IMD_USUARIO: ${{ secrets.IMD_USUARIO }}
      IMD_CONTRASENA: ${{ secrets.IMD_CONTRASENA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ¿Hay algo que vigilar?
        id: toca
        env:
          PRUEBA: ${{ inputs.prueba }}
        run: |
          if [ -n "$PRUEBA" ]; then echo "hay=1" >> "$GITHUB_OUTPUT"; else node vigilar.mjs --comprobar; fi
      - name: Preparar el navegador
        if: steps.toca.outputs.hay == '1'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Vigilar
        if: steps.toca.outputs.hay == '1'
        env:
          PRUEBA: ${{ inputs.prueba }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PRUEBA" ]; then
            set -- $PRUEBA
            if [ "$1" = "ficha" ]; then
              node vigilar.mjs --ficha --fecha "$2" --hora "$3"
            elif [ "$1" = "cambiar" ]; then
              node vigilar.mjs --cambiar --fecha "$2" --hora "$3" --vieja "$4"
            elif [ "$1" = "ida-y-vuelta" ]; then
              node vigilar.mjs --ida-y-vuelta --fecha "$2" --hora "$3" --vieja "$4"
            else
              node vigilar.mjs --prueba --fecha "$1" --hora "$2" ${3:+--vieja "$3"}
            fi
          else
            node vigilar.mjs
          fi
