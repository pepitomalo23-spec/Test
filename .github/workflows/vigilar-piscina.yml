name: Vigilar piscina

# «Cogerla si se libera» (pantalla Piscina de la app): mientras haya alguna hora pedida para un día
# ya abierto, mira cada 3 s y, en cuanto se libera, la reserva (cambiando la que tuvieras ese día),
# con el navegador ya preparado. Cada 5 minutos comprueba si hay algo que vigilar; cada vigilancia
# dura hasta 5 h 45 min y, al acabar, la siguiente empieza enseguida.
on:
  schedule:
    - cron: '*/5 4-22 * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Prueba sin tocar nada: «AAAA-MM-DD HH:MM [hora vieja]». De verdad: «ida-y-vuelta AAAA-MM-DD HH:MM hora-vieja»'
        required: false

concurrency:
  group: vigilar-piscina
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: reserva-piscina
    env:
      SUPABASE_URL: https://tsjaaqkvncgxqtpmlugv.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_F9-gdlx34vn7FQ_1hSHwcQ__L5EGMOS
      PISCINA_CLAVE: ${{ secrets.PISCINA_CLAVE }}
      IMD_USUARIO: ${{ secrets.IMD_USUARIO }}
      IMD_CONTRASENA: ${{ secrets.IMD_CONTRASENA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ¿Hay algo que vigilar?
        id: toca
        env:
          PRUEBA: ${{ inputs.prueba }}
        run: |
          if [ -n "$PRUEBA" ]; then echo "hay=1" >> "$GITHUB_OUTPUT"; else node vigilar.mjs --comprobar; fi
      - name: Preparar el navegador
        if: steps.toca.outputs.hay == '1'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Vigilar
        if: steps.toca.outputs.hay == '1'
        env:
          PRUEBA: ${{ inputs.prueba }}
        run: |
          if [ -n "$PRUEBA" ]; then
            set -- $PRUEBA
            if [ "$1" = "ida-y-vuelta" ]; then
              node vigilar.mjs --ida-y-vuelta --fecha "$2" --hora "$3" --vieja "$4"
            else
              node vigilar.mjs --prueba --fecha "$1" --hora "$2" ${3:+--vieja "$3"}
            fi
          else
            node vigilar.mjs
          fi
